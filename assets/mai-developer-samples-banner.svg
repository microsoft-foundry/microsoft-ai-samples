<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title description">
  <title id="title">Microsoft AI (MAI) Developer Samples</title>
  <desc id="description">A text-based developer samples banner on a dark blue background with blue and mint accents. Build with MAI models. Learn by doing. Scenarios, samples, and workshops.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1224"/>
      <stop offset="1" stop-color="#172b46"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#72a7ff"/>
      <stop offset="1" stop-color="#83ebcf"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#b6ceee" stroke-opacity="0.06"/>
    </pattern>
  </defs>
  <rect width="1280" height="360" rx="20" fill="url(#background)"/>
  <rect width="1280" height="360" rx="20" fill="url(#grid)"/>
  <rect x="56" y="52" width="56" height="5" rx="2.5" fill="url(#accent)"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="56" y="102" fill="#a8c9ff" font-size="21" font-weight="600" letter-spacing="2">MICROSOFT AI (MAI)</text>
    <text x="56" y="168" fill="#ffffff" font-size="52" font-weight="700">Developer Samples</text>
    <text x="56" y="215" fill="#d0dfef" font-size="25">Build with MAI models. Learn by doing.</text>
    <text x="56" y="301" fill="#b9cfe5" font-size="18" letter-spacing="1">SCENARIOS - SAMPLES - WORKSHOPS</text>
  </g>
  <g fill="none" stroke="url(#accent)" stroke-linecap="round" stroke-linejoin="round">
    <rect x="950" y="79" width="240" height="202" rx="18" stroke-width="2" opacity="0.45"/>
    <path d="M 950 121 H 1190" stroke-width="2" opacity="0.45"/>
    <path d="M 1024 164 L 998 190 L 1024 216 M 1116 164 L 1142 190 L 1116 216 M 1082 156 L 1058 224" stroke-width="6"/>
  </g>
  <g fill="#a8c9ff" opacity="0.8">
    <circle cx="973" cy="101" r="4"/>
    <circle cx="989" cy="101" r="4"/>
    <circle cx="1005" cy="101" r="4"/>
  </g>
  <rect x="56" y="332" width="1168" height="2" rx="1" fill="url(#accent)" opacity="0.65"/>
</svg>
