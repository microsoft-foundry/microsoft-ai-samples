<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 156" width="1200" height="156" role="img" aria-label="Your customer asks: The launch kit is ready. Can the new page use it?">
  <title>Your customer asks: The launch kit is ready. Can the new page use it?</title>
  <defs>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1224"/>
      <stop offset="1" stop-color="#12203a"/>
    </linearGradient>
    <clipPath id="card"><rect width="1200" height="156" rx="22"/></clipPath>
  </defs>
  <g clip-path="url(#card)" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
    <rect width="1200" height="156" fill="url(#teal)"/>
    <rect width="10" height="156" fill="#83ebcf"/>
    <text x="1150" y="150" font-size="220" font-weight="800" text-anchor="end" fill="#fff" fill-opacity="0.12">”</text>
    <circle cx="80" cy="78.0" r="38" fill="#fff" fill-opacity="0.18"/>
    <text x="80" y="80.0" font-size="40" text-anchor="middle" dominant-baseline="middle" font-family="'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif">🛍️</text>
    <text x="140" y="44" font-size="16" font-weight="700" letter-spacing="3" fill="#a8c9ff">YOUR CUSTOMER ASKS</text>
    <text x="140" y="86" font-size="28" font-style="italic" font-weight="600" fill="#fff">The launch kit is ready.</text>
    <text x="140" y="124" font-size="28" font-style="italic" font-weight="600" fill="#fff">Can the new page use it?</text>
  </g>
</svg>
