<svg xmlns="http://www.w3.org/2000/svg" width="960" height="760" viewBox="0 0 960 760">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#d7e2ef" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="960" height="760" fill="#fbfcff"/>
  <rect width="960" height="760" fill="url(#grid)"/>

  <g fill="#173f73" font-family="Comic Sans MS, Segoe Print, cursive">
    <text x="58" y="70" font-size="36">CONTOSO OUTDOORS 2.0</text>
    <path d="M58 82 C250 86 425 78 610 82" fill="none" stroke="#173f73" stroke-width="3"/>
    <text x="620" y="66" font-size="20">→ use same data as 2023</text>

    <!-- 1 Home -->
    <rect x="58" y="112" width="400" height="270" fill="#fff" stroke="#173f73" stroke-width="3"/>
    <text x="82" y="150" font-size="27">① HOME</text>
    <rect x="82" y="168" width="352" height="94" fill="#fff" stroke="#173f73" stroke-width="3"/>
    <path d="M106 238 L145 188 L198 226 L256 177 L306 222 L348 238" fill="none" stroke="#173f73" stroke-width="3"/>
    <text x="270" y="198" font-size="18">big hero photo</text>
    <rect x="82" y="282" width="352" height="38" fill="#fff" stroke="#173f73" stroke-width="2"/>
    <text x="96" y="307" font-size="18">[ search……… ]</text>
    <rect x="82" y="338" width="76" height="38" fill="#fff" stroke="#173f73" stroke-width="2"/>
    <rect x="166" y="338" width="76" height="38" fill="#fff" stroke="#173f73" stroke-width="2"/>
    <rect x="250" y="338" width="76" height="38" fill="#fff" stroke="#173f73" stroke-width="2"/>
    <text x="96" y="362" font-size="16">Tents</text>
    <text x="180" y="362" font-size="16">Packs</text>
    <text x="264" y="362" font-size="16">Stoves</text>

    <!-- 2 All Tents -->
    <rect x="490" y="112" width="420" height="270" fill="#fff" stroke="#173f73" stroke-width="3"/>
    <text x="514" y="150" font-size="27">② ALL TENTS</text>
    <text x="514" y="178" font-size="17">Filters - Price - Season</text>
    <g fill="#fff" stroke="#173f73" stroke-width="2">
      <rect x="514" y="194" width="112" height="78"/><rect x="638" y="194" width="112" height="78"/><rect x="762" y="194" width="112" height="78"/>
      <rect x="514" y="282" width="112" height="78"/><rect x="638" y="282" width="112" height="78"/><rect x="762" y="282" width="112" height="78"/>
    </g>
    <text x="514" y="382" font-size="17">card = photo + name + $$</text>

    <!-- chat bubble on every page arrow -->
    <circle cx="434" cy="365" r="18" fill="#fff" stroke="#173f73" stroke-width="3"/>
    <path d="M446 378 C470 406 490 430 512 460" fill="none" stroke="#173f73" stroke-width="3"/>
    <path d="M512 460 l-18 -2 l10 -15" fill="#173f73"/>
    <text x="356" y="354" font-size="17" fill="#ad2a2a">chat bubble on EVERY page</text>

    <!-- 3 Product -->
    <rect x="58" y="430" width="400" height="270" fill="#fff" stroke="#173f73" stroke-width="3"/>
    <text x="82" y="468" font-size="27">③ PRODUCT</text>
    <rect x="82" y="486" width="150" height="150" fill="#fff" stroke="#173f73" stroke-width="3"/>
    <path d="M94 620 L145 512 L212 620 Z" fill="#fff" stroke="#173f73" stroke-width="3"/>
    <text x="252" y="510" font-size="23">Trail Master</text>
    <text x="252" y="540" font-size="23">X4 · $250</text>
    <text x="252" y="574" font-size="20">4/5 stars</text>
    <path d="M252 594 h118 M252 612 h118 M252 630 h118" stroke="#173f73" stroke-width="2"/>
    <rect x="82" y="652" width="150" height="40" fill="#fff" stroke="#173f73" stroke-width="2"/>
    <text x="96" y="678" font-size="18">ADD TO CART</text>
    <text x="252" y="678" font-size="17" fill="#ad2a2a">← cart later</text>
    <text x="82" y="708" font-size="16">Photo Gallery (swipe)</text>

    <!-- 4 Ask Contoso -->
    <rect x="490" y="430" width="420" height="270" fill="#fff" stroke="#173f73" stroke-width="3"/>
    <text x="514" y="468" font-size="27">④ ASK CONTOSO</text>

    <rect x="514" y="500" width="246" height="58" rx="8" fill="#fff" stroke="#173f73" stroke-width="2"/>
    <text x="528" y="526" font-size="17">Which tent is good</text>
    <text x="528" y="548" font-size="17">for October?</text>

    <rect x="606" y="576" width="240" height="58" rx="8" fill="#fff" stroke="#173f73" stroke-width="2"/>
    <text x="620" y="604" font-size="17">Alpine Explorer. Its ..</text>

    <rect x="514" y="650" width="292" height="38" rx="8" fill="#fff" stroke="#173f73" stroke-width="2"/>
    <text x="528" y="675" font-size="17">Type a question</text>
    <circle cx="836" cy="668" r="22" fill="#fff" stroke="#173f73" stroke-width="2"/>
    <text x="816" y="675" font-size="16">mic</text>
    <text x="800" y="716" font-size="16" fill="#ad2a2a">voice in v2</text>

    <!-- three doors -->
    <text x="58" y="744" font-size="21">3 doors: web · REST API · MCP</text>
  </g>
</svg>
